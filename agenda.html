<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glow Beauty | Agenda</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <h3 id="saudacaoCliente">Olá, cliente</h3>
        <a href="agenda.html" class="sidebar-link active">Agendar</a>
        <a href="meus-agendamentos.html" class="sidebar-link">Meus agendamentos</a>
        <a href="configuracao-conta.html" class="sidebar-link">Configuração da conta</a>
        <button type="button" id="btnSairCliente" class="reset-btn">Sair</button>
      </aside>

      <main class="dashboard">
        <h1>Escolha sua data e horário</h1>
      <p>Veja as disponibilidades da semana e selecione o melhor momento.</p>

      <section class="calendar-card">
        <h2>Escolha o serviço</h2>
        <p class="section-subtitle">Selecione o serviço desejado antes de confirmar o agendamento.</p>

        <div class="servico-grupo">
          <button type="button" class="servico-grupo-header">Cuidados Básicos</button>
          <div class="servico-lista hidden">
            <label class="servico-item"><input type="radio" name="servico" class="bolinha-selecao" value="Cutilagem" /> Cutilagem</label>
            <label class="servico-item"><input type="radio" name="servico" class="bolinha-selecao" value="Corte e Lixamento" /> Corte e Lixamento</label>
            <label class="servico-item"><input type="radio" name="servico" class="bolinha-selecao" value="Esmaltação tradicional" /> Esmaltação tradicional</label>
          </div>
        </div>

        <div class="servico-grupo">
          <button type="button" class="servico-grupo-header">Técnicas e Esmaltações Especiais</button>
          <div class="servico-lista hidden">
            <label class="servico-item"><input type="radio" name="servico" class="bolinha-selecao" value="Esmaltação em gel" /> Esmaltação em gel</label>
            <label class="servico-item"><input type="radio" name="servico" class="bolinha-selecao" value="Blindagem" /> Blindagem</label>
            <label class="servico-item"><input type="radio" name="servico" class="bolinha-selecao" value="Spa das Mãos" /> Spa das Mãos</label>
          </div>
        </div>

        <div class="servico-grupo">
          <button type="button" class="servico-grupo-header">Alongamento e Decoração</button>
          <div class="servico-lista hidden">
            <label class="servico-item"><input type="radio" name="servico" class="bolinha-selecao" value="Alongamento de Unhas" /> Alongamento de Unhas</label>
            <label class="servico-item"><input type="radio" name="servico" class="bolinha-selecao" value="Manutenção e Conserto" /> Manutenção e Conserto</label>
            <label class="servico-item"><input type="radio" name="servico" class="bolinha-selecao" value="Nail Art" /> Nail Art</label>
          </div>
        </div>

        <p id="servicoEscolhido" class="mensagem"></p>
      </section>

      <section class="calendar-card">
        <div class="calendar-toolbar">
          <h2>Disponibilidade</h2>
          <div class="calendar-controls">
            <label>
              Mês
              <select id="selectMesCliente"></select>
            </label>
            <label>
              Ano
              <select id="selectAnoCliente"></select>
            </label>
          </div>
        </div>
        <div class="calendar" id="calendar"></div>
        <div class="time-slots" id="timeSlots"></div>
        <button id="confirmarAgendamento" class="confirm-btn">Confirmar agendamento</button>
        <div id="confirmacao" class="confirmacao"></div>
      </section>

        <div class="links-row">
          <a href="profissional.html" class="back-link">Ver agendamentos</a>
        </div>
      </main>
    </div>

    <script src="common.js"></script>
    <script src="agenda.js"></script>
  </body>
</html>
