<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glow Beauty | Configurações</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="dashboard">
      <h1>Configurações de lembretes</h1>
      <p>Gerencie as mensagens automáticas para os clientes.</p>

      <section class="calendar-card">
        <h2>Mensagem padrão</h2>
        <textarea id="textoLembrete" rows="4">Olá! Lembrete de seu agendamento com a profissional. Não esqueça de comparecer.</textarea>
        <button id="salvarLembrete">Salvar mensagem</button>
        <button id="limparHistorico" class="reset-btn">Limpar histórico</button>
      </section>

      <section class="calendar-card">
        <h2>Contatos para lembrete</h2>
        <ul id="listaContatos" class="contact-list"></ul>
      </section>

      <div class="links-row">
        <a href="profissional.html" class="back-link">Voltar aos agendamentos</a>
        <a href="#" class="back-link" onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href = 'index.html'; } return false;">Voltar</a>
      </div>
    </main>

    <script src="configuracoes.js"></script>
  </body>
</html>
